tasks:
  # ── Bench ──
  bench:overhead:
    cmds:
      - bash scripts/bench-overhead.sh
    desc: "Measure datamitsu launch + planner overhead (tsbench probe tool gated by DATAMITSU_BENCH=1)"
  # ── Build ──
  build:
    cmds:
      - go build
      - task: pack:prepare
    deps:
      - "build:lib"
    desc: Build datamitsu binary and prepare packages
  build:inspector:
    cmds:
      - pnpm --filter @datamitsu/inspector build
    desc: Build the single-file inspector artifact embedded by internal/inspector
  build:lib:
    cmds:
      - pnpm exec tsdown --config ./config/tsdown.config.ts
      - sed '/^export {};$/d' ./config/dist/main.mjs > ./internal/config/config.js
      - cp ./config/config.d.ts ./internal/config/config.d.ts
    deps:
      - "generate:prompts"
      - "build:inspector"
    desc: Build the embedded JS artifacts — config library and inspector — before any Go build
  build:parsers:
    cmds:
      # From parsers/, where rustup finds rust-toolchain.toml.
      - cargo build --release --target wasm32-unknown-unknown
      - "echo \"wasm size: $(wc -c < target/wasm32-unknown-unknown/release/datamitsu_parsers.wasm) bytes\""
      - task: gen:parsers-doc
    desc: Build the Rust→WASM parser modules, report size, and regenerate the catalog doc
    dir: parsers
  build:parsers:fixture:
    cmds:
      # The remapped prefixes keep the home directory, the cargo home and the
      # toolchain's install path out of a module that is committed.
      - |
        RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$(rustc --print sysroot)/lib/rustlib/src/rust=/rustc/$(rustc -vV | sed -n 's/^commit-hash: //p') --remap-path-prefix=$PWD=/src" \
          cargo build --release --target wasm32-unknown-unknown
      - cp target/wasm32-unknown-unknown/release/datamitsu_parsers.wasm ../internal/parsermanager/testdata/echo.wasm
      - task: gen:parsers-doc
    desc: Build the public parser module into internal/parsermanager/testdata/echo.wasm, the module the core's tests run, and regenerate the catalog doc
    dir: parsers
  # ── Demo ──
  demo:capture:
    cmds:
      - |
        docker run --rm --platform linux/amd64 \
          --volume "$(pwd)/scripts:/scripts:ro" \
          --volume "$(pwd)/website/static:/output" \
          node:26.7.0-trixie-slim \
          sh /scripts/docker-capture.sh
      # The capture writes its metadata beside the casts, the only directory the
      # container is given; the website reads it from its data folder.
      - mv website/static/recordings.json website/src/data/recordings.json
    desc: Record cold.cast, warm.cast and scope.cast in ovineko/ovineko inside Docker (linux/amd64) with that repository's own datamitsu
  # ── Docker ──

  # ── Dev ──
  dev:link:
    cmds:
      - node packaging/dev-link.ts
    desc: Build a linkable dev npm package (core + local WASM parser) into dist/dev-link for testing an unreleased core in a real project
  docker:build:
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64 --file docker/Dockerfile --tag datamitsu/datamitsu:dev --load .
      - docker buildx build --platform linux/amd64,linux/arm64 --file docker/Dockerfile.alpine --tag datamitsu/datamitsu:dev-alpine --load .
    deps:
      - "pack:build"
    desc: Build Docker images locally (Debian + Alpine)
  docker:test:
    cmds:
      - docker run --rm datamitsu/datamitsu:dev version
      - docker run --rm datamitsu/datamitsu:dev-alpine version
    desc: Test local Docker images
  gen:llms-docs:
    cmds:
      # docusaurus-plugin-llms already emits the cleaned per-page markdown; the
      # harvester only reshapes it into the embedded snapshot. Unlike
      # gen:parsers-doc there is deliberately no `dm fix` step: the pages are
      # embedded verbatim and their bytes are hashed into manifest.json, so any
      # formatting would break that identity (see .datamitsuignore).
      - pnpm --filter website build
      - go run ./packaging/llms-harvest
    desc: Regenerate the embedded llms documentation snapshot from the Docusaurus build
  gen:parsers-doc:
    cmds:
      # Core emits JSON (its only job); the TS script turns it into Markdown, so the
      # website build just renders the committed page — never needing Rust/Go/wasm.
      # node_modules/.bin/tsx directly (not `pnpm exec`, whose engine warning would
      # leak into the redirected stdout).
      - go run . devtools parsers list --wasm parsers/target/wasm32-unknown-unknown/release/datamitsu_parsers.wasm --json | ./node_modules/.bin/tsx packaging/parsers-catalog.ts > website/docs/reference/parser-catalog.md
      # Format the generated page with the repo's own tools so it matches what the
      # pre-commit hook expects (idempotent → no drift, no .prettierignore needed).
      - pnpm dm fix --tools prettier,oxfmt ./website/docs/reference/parser-catalog.md
    desc: Regenerate the parser-catalog docs page from the built WASM module (run by build:parsers)
  gen:toolenv-doc:
    cmds:
      - go run ./packaging/toolenv-doc > website/docs/reference/tool-environment.md
      # The page is rendered already formatted, so this must change nothing:
      # internal/toolenv's freshness test compares the rendering with the
      # committed page byte for byte. Only the formatters that own Markdown run;
      # a plain `dm fix` would also format the whole Go project.
      - pnpm dm fix --tools prettier,oxfmt ./website/docs/reference/tool-environment.md
    desc: Regenerate the tool-environment reference page from internal/toolenv
  generate:prompts:
    cmds:
      - node config/scripts/generate-prompts.ts
    desc: Generate prompts TypeScript file from markdown
  # ── Packaging ──
  pack:all:
    cmds:
      - node packaging/pack.ts all
    desc: Full packaging workflow (clean, build, prepare, dry-run publish)
  pack:build:
    cmds:
      - node packaging/pack.ts build
    desc: Build Go binaries for all platforms
  pack:build-api:
    cmds:
      - pnpm --filter @datamitsu/programmable-api-js build
      - rm -rf packaging/npm/datamitsu/lib
      - cp -r programmable-api/js/dist packaging/npm/datamitsu/lib
    desc: Build programmable API and copy to wrapper
  pack:build-python:
    cmds:
      - node packaging/pack.ts build-python
    desc: Build Python wheels for all platforms
  pack:clean:
    cmds:
      - node packaging/pack.ts clean
    desc: Clean previous build artifacts
  pack:prepare:
    cmds:
      - node packaging/pack.ts prepare
      - pnpm datamitsu fix
    deps:
      - "pack:build-api"
    desc: Build binaries and prepare npm packages
  pack:prepare-python:
    cmds:
      - node packaging/pack.ts prepare-python
    desc: Prepare Python packages from normalized binaries
  pack:prepare-ruby:
    cmds:
      - node packaging/pack.ts prepare-ruby
    desc: Prepare Ruby gem from normalized binaries
  pack:publish:
    cmds:
      - node packaging/pack.ts publish
    desc: Publish to npm
  pack:publish-python:
    cmds:
      - node packaging/pack.ts publish-python
    desc: Publish to PyPI
  pack:publish-python:dry:
    cmds:
      - node packaging/pack.ts publish-python --dry-run
    desc: Dry-run PyPI publish
  pack:publish-ruby:
    cmds:
      - node packaging/pack.ts publish-ruby
    desc: Publish to RubyGems
  pack:publish-ruby:dry:
    cmds:
      - node packaging/pack.ts publish-ruby --dry-run
    desc: Dry-run RubyGems publish
  pack:publish:dry:
    cmds:
      - node packaging/pack.ts publish --dry-run
    desc: Dry-run npm publish
  # ── Test ──
  test:coverage:all:
    cmds:
      - bash scripts/coverage-all.sh
    desc: Combined coverage — merge unit-test covdata with the blackbox CLI subprocess covdata into one profile
  test:fuzz:
    cmds:
      - |
        for fn in FuzzParse FuzzMatcher; do
          go test -run='^$' -fuzz="^${fn}$" -fuzztime={{.FUZZTIME}} ./internal/datamitsuignore/
        done
    desc: Fuzz the .datamitsuignore parser and matcher (override FUZZTIME, e.g. FUZZTIME=2m)
    vars:
      FUZZTIME: "{{.FUZZTIME | default \"20s\"}}"
version: "3"
