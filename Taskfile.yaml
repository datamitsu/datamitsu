tasks:
  # ── Bench ──
  bench:overhead:
    cmds:
      - bash scripts/bench-overhead.sh
    desc: "Measure datamitsu launch + planner overhead (tsbench probe tool gated by DATAMITSU_BENCH=1)"
  # ── Build ──
  build:
    cmds:
      - go build
      - task: pack:prepare
    deps:
      - "build:lib"
    desc: Build datamitsu binary and prepare packages
  build:lib:
    cmds:
      - pnpm exec tsdown --config ./config/tsdown.config.ts
      - sed '/^export {};$/d' ./config/dist/main.mjs > ./internal/config/config.js
      - cp ./config/config.d.ts ./internal/config/config.d.ts
    deps:
      - "generate:prompts"
    desc: Build config library (generate prompts, compile, copy)
  # ── Demo ──
  demo:capture:
    cmds:
      - |
        docker run --rm --platform linux/amd64 \
          --volume "$(pwd)/scripts:/scripts:ro" \
          --volume "$(pwd)/website/static:/output" \
          node:24-slim \
          sh /scripts/docker-capture.sh
    desc: Run datamitsu check in ovineko/ovineko inside Docker (linux/amd64), write website/static/cold.cast + warm.cast
  # ── Docker ──

  docker:build:
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64 --file docker/Dockerfile --tag datamitsu/datamitsu:dev --load .
      - docker buildx build --platform linux/amd64,linux/arm64 --file docker/Dockerfile.alpine --tag datamitsu/datamitsu:dev-alpine --load .
    deps:
      - "pack:build"
    desc: Build Docker images locally (Debian + Alpine)
  docker:test:
    cmds:
      - docker run --rm datamitsu/datamitsu:dev version
      - docker run --rm datamitsu/datamitsu:dev-alpine version
    desc: Test local Docker images
  generate:prompts:
    cmds:
      - node config/scripts/generate-prompts.ts
    desc: Generate prompts TypeScript file from markdown
  # ── Packaging ──
  pack:all:
    cmds:
      - node packaging/pack.ts all
    desc: Full packaging workflow (clean, build, prepare, dry-run publish)
  pack:build:
    cmds:
      - node packaging/pack.ts build
    desc: Build Go binaries for all platforms
  pack:build-api:
    cmds:
      - pnpm --filter @datamitsu/programmable-api-js build
      - rm -rf packaging/npm/datamitsu/lib
      - cp -r programmable-api/js/dist packaging/npm/datamitsu/lib
    desc: Build programmable API and copy to wrapper
  pack:build-python:
    cmds:
      - node packaging/pack.ts build-python
    desc: Build Python wheels for all platforms
  pack:clean:
    cmds:
      - node packaging/pack.ts clean
    desc: Clean previous build artifacts
  pack:prepare:
    cmds:
      - node packaging/pack.ts prepare
      - pnpm datamitsu fix
    deps:
      - "pack:build-api"
    desc: Build binaries and prepare npm packages
  pack:prepare-python:
    cmds:
      - node packaging/pack.ts prepare-python
    desc: Prepare Python packages from normalized binaries
  pack:prepare-ruby:
    cmds:
      - node packaging/pack.ts prepare-ruby
    desc: Prepare Ruby gem from normalized binaries
  pack:publish:
    cmds:
      - node packaging/pack.ts publish
    desc: Publish to npm
  pack:publish-python:
    cmds:
      - node packaging/pack.ts publish-python
    desc: Publish to PyPI
  pack:publish-python:dry:
    cmds:
      - node packaging/pack.ts publish-python --dry-run
    desc: Dry-run PyPI publish
  pack:publish-ruby:
    cmds:
      - node packaging/pack.ts publish-ruby
    desc: Publish to RubyGems
  pack:publish-ruby:dry:
    cmds:
      - node packaging/pack.ts publish-ruby --dry-run
    desc: Dry-run RubyGems publish
  pack:publish:dry:
    cmds:
      - node packaging/pack.ts publish --dry-run
    desc: Dry-run npm publish
  # ── Test ──
  test:coverage:all:
    cmds:
      - bash scripts/coverage-all.sh
    desc: Combined coverage — merge unit-test covdata with the blackbox CLI subprocess covdata into one profile
  test:fuzz:
    cmds:
      - |
        for fn in FuzzParse FuzzMatcher; do
          go test -run='^$' -fuzz="^${fn}$" -fuzztime={{.FUZZTIME}} ./internal/datamitsuignore/
        done
    desc: Fuzz the .datamitsuignore parser and matcher (override FUZZTIME, e.g. FUZZTIME=2m)
    vars:
      FUZZTIME: "{{.FUZZTIME | default \"20s\"}}"
version: "3"
