glob_matcher: doublestar
pre-commit:
  commands:
    commit identity:
      priority: 1
      run: "if git config user.email | grep -qF 'datamitsu.invalid'; then\n  echo \"error: committing as $(git config user.name) <$(git config user.email)>\" >&2\n  echo \"That is the internal/clitest fixture identity, not a real author.\" >&2\n  echo \"Fix: git config --local --unset user.name && git config --local --unset user.email\" >&2\n  exit 1\nfi\n"
    test:
      priority: 2
      run: pnpm test
    datamitsu-init:
      priority: 10
      run: pnpm datamitsu init
    datamitsu-check:
      priority: 40
      run: pnpm datamitsu check --file-scoped
      stage_fixed: true
    llms-docs:
      # The embedded llms snapshot is harvested from the website build, so it
      # must be generated after datamitsu-check: the fixer realigns website
      # markdown, and a snapshot taken before that would disagree with the
      # committed pages — the drift the Embedded Docs Drift check catches.
      # The snapshot lives outside this job's staged-file globs, so
      # stage_fixed would not pick it up; the run adds it explicitly.
      priority: 50
      glob:
        - "website/docs/**"
        - "packaging/llms-harvest/**"
      run: pnpm --filter website build && go run ./packaging/llms-harvest && git add -- internal/llmsdocs/embed && { git diff --cached --name-only > /tmp/index-debug.txt; env | grep -E '^GIT' > /tmp/gitenv-debug.txt; true; }
  parallel: false
commit-msg:
  commands:
    lint commit message:
      run: "pnpm datamitsu exec commitlint -- --edit {1}"
post-checkout:
  commands:
    install deps:
      priority: 1
      run: pnpm i -y
    init datamitsu:
      priority: 2
      run: pnpm datamitsu init
  parallel: false
