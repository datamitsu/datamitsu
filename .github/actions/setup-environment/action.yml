description: Setup pnpm, Node.js, Go, and datamitsu cache
inputs:
  cache-datamitsu:
    default: "true"
    description: Whether to cache datamitsu store
    required: false
  cache-toolchains:
    default: "true"
    description: Whether to cache pnpm and Go dependencies and build outputs
    required: false
  install-dependencies:
    default: "true"
    description: Whether to run pnpm install
    required: false
  registry-url:
    default: ""
    description: npm registry URL (for publishing workflows)
    required: false
  setup-go:
    default: "true"
    description: Whether to setup Go
    required: false
  setup-node:
    default: "true"
    description: Whether to setup Node.js and pnpm
    required: false
name: Setup Environment
runs:
  steps:
    - if: ${{ inputs.setup-node == 'true' }}
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # Auto-detects from package.json packageManager field
    - if: ${{ inputs.setup-node == 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        cache: ${{ inputs.cache-toolchains == 'true' && 'pnpm' || '' }}
        node-version-file: ".node-version"
        package-manager-cache: ${{ inputs.cache-toolchains == 'true' }}
        registry-url: ${{ inputs.registry-url != '' && inputs.registry-url || null }}
    - if: ${{ inputs.setup-go == 'true' }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        cache: ${{ inputs.cache-toolchains == 'true' }}
        go-version-file: go.mod
    - if: ${{ inputs.cache-datamitsu == 'true' }}
      name: Cache datamitsu store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: datamitsu-store-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'datamitsu.config.js', 'datamitsu.config.ts') }}
        path: ~/.cache/datamitsu/store
        restore-keys: |
          datamitsu-store-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
    - if: ${{ inputs.install-dependencies == 'true' && inputs.setup-node == 'true' }}
      name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
  using: composite
