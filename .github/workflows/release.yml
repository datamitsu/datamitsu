jobs:
  build:
    if: |
      always() &&
      !cancelled() &&
      (needs.validate-stable.result == 'success' || needs.generate-unstable-version.result == 'success')
    name: Build Release
    needs:
      - determine-release-type
      - validate-stable
      - generate-unstable-version
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout + Setup
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.determine-release-type.outputs.checkout_ref }}
      - uses: ./.github/actions/setup-environment
      - name: Check Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # 2a. Build WASM parser modules — MUST precede goreleaser so the .wasm
      #     SHA-256 lands in checksums.txt (and is thus covered by the cosign
      #     signature). rustup/cargo are preinstalled on ubuntu-latest; only the
      #     freestanding wasm32 target needs adding.
      - name: Add Rust wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache cargo registry + wasm target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: wasm-parsers-${{ runner.os }}-${{ hashFiles('parsers/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            parsers/target
          restore-keys: |
            wasm-parsers-${{ runner.os }}-
      - # DATAMITSU_PARSERS_VERSION is baked into the module's `describe` output
        # (like a Go ldflags -X), read at compile time by option_env! in
        # parsers/src/capabilities.rs. The module — not the config — is the source
        # of truth for its version.
        env:
          DATAMITSU_PARSERS_VERSION: ${{ needs.determine-release-type.outputs.is_stable == 'true' && needs.validate-stable.outputs.version || needs.generate-unstable-version.outputs.version }}
        name: Build WASM parser modules
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path parsers/Cargo.toml
          echo "wasm size: $(wc -c < parsers/target/wasm32-unknown-unknown/release/datamitsu_parsers.wasm) bytes"
      # 2. Build Binaries (GoReleaser)
      - env:
          # Canonical base image ref baked into the binary for `devtools dockerfile`.
          # Stable and unstable images live in different repos/tags, so the version
          # string alone cannot identify them. For stable, the tag is left empty so
          # GoReleaser falls back to {{ .Version }}.
          DATAMITSU_IMAGE_REPO: ${{ needs.determine-release-type.outputs.is_unstable == 'true' && 'datamitsu/datamitsu-unstable' || 'datamitsu/datamitsu' }}
          DATAMITSU_IMAGE_TAG: ${{ needs.determine-release-type.outputs.is_unstable == 'true' && needs.generate-unstable-version.outputs.tag_name || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.determine-release-type.outputs.is_stable == 'true' && needs.validate-stable.outputs.version || needs.generate-unstable-version.outputs.version }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_TOKEN: ${{ secrets.SCOOP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        name: Build binaries with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release ${{ needs.determine-release-type.outputs.is_unstable == 'true' && '--snapshot' || '' }} --clean
          distribution: goreleaser
          version: "~> v2"
      # 2b. Fail the build if the WASM parser module is not in checksums.txt
      #     (the signed file) — it would otherwise ship unverifiable.
      - name: Assert WASM is in checksums.txt
        run: .github/scripts/assert-wasm-checksum.sh
      # 3. Attest build artifacts
      - if: ${{ !env.ACT }}
        name: Attest build artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: ./dist/checksums.txt
      # 3a. The .vsix is built INSIDE GoReleaser (vsix `signs` entry in
      #     .goreleaser.yml) so it ships within GoReleaser's atomic
      #     draft->publish flow — the release is complete before the
      #     homebrew/scoop/winget manifests are pushed. Re-publish it here as a
      #     small artifact so the store publish jobs don't need the full
      #     release-artifacts for one file. Missing files are fine for unstable
      #     (--snapshot) runs.
      - if: ${{ !env.ACT }}
        name: Upload .vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: warn
          name: vsix
          path: dist/*.vsix
          retention-days: 1
      # 4. Normalize binaries
      - name: Normalize binaries
        run: .github/scripts/normalize-binaries.sh "${{ needs.determine-release-type.outputs.is_unstable }}"
      # 5. Build Programmable API
      - name: Build programmable API
        run: |
          cd programmable-api/js
          pnpm build
          cd ../..
          mkdir -p packaging/npm/datamitsu/lib
          cp -r programmable-api/js/dist/* packaging/npm/datamitsu/lib/
          echo "✓ Copied programmable API to lib/"
          ls -lh packaging/npm/datamitsu/lib/
      # 6. Prepare npm Packages
      - name: Prepare npm packages
        run: |
          VERSION_WITH_V="${{ needs.determine-release-type.outputs.is_stable == 'true' && needs.validate-stable.outputs.version || needs.generate-unstable-version.outputs.version }}"
          export VERSION="${VERSION_WITH_V#v}"
          pnpm pack:prepare
      # 7. Prepare Docker Binaries
      - name: Prepare Docker binaries
        run: |
          mkdir -p dist/datamitsu-linux-amd64
          mkdir -p dist/datamitsu-linux-arm64

          cp dist/binaries/datamitsu-linux_amd64 dist/datamitsu-linux-amd64/datamitsu
          cp dist/binaries/datamitsu-linux_arm64 dist/datamitsu-linux-arm64/datamitsu

          chmod +x dist/datamitsu-linux-*/datamitsu
          ls -lh dist/datamitsu-linux-*/
      # 8. Test Docker Build (dry-run, no push)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: linux/amd64,linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: version
        name: Normalize version (remove v prefix for labels)
        run: |
          VERSION_WITH_V="${{ needs.determine-release-type.outputs.is_stable == 'true' && needs.validate-stable.outputs.version || needs.generate-unstable-version.outputs.version }}"
          VERSION="${VERSION_WITH_V#v}"
          echo "normalized=$VERSION" >> $GITHUB_OUTPUT
      # Generate metadata for test builds
      - id: meta-debian
        name: Generate Docker metadata (Debian)
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/datamitsu/datamitsu
            docker.io/datamitsu/datamitsu
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.normalized }}
          tags: |
            type=raw,value=test-debian
      - id: meta-alpine
        name: Generate Docker metadata (Alpine)
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: |
            suffix=-alpine
          images: |
            ghcr.io/datamitsu/datamitsu
            docker.io/datamitsu/datamitsu
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.normalized }}
          tags: |
            type=raw,value=test-alpine
      - name: Test Docker build (Debian)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: ./docker/Dockerfile
          labels: ${{ steps.meta-debian.outputs.labels }}
          load: false
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Test Docker build (Alpine)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: ./docker/Dockerfile.alpine
          labels: ${{ steps.meta-alpine.outputs.labels }}
          load: false
          platforms: linux/amd64,linux/arm64
          push: false
      # 9. Upload Artifact (everything needed for publish jobs)
      - if: ${{ !env.ACT }}
        name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            dist/
            packaging/npm/
          retention-days: 1
  determine-release-type:
    name: Determine Release Type
    outputs:
      checkout_ref: ${{ steps.detect.outputs.checkout_ref }}
      is_stable: ${{ steps.detect.outputs.is_stable }}
      is_unstable: ${{ steps.detect.outputs.is_unstable }}
    runs-on: ubuntu-latest
    steps:
      - id: detect
        name: Detect release type
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag push → stable
            echo "is_stable=true" >> $GITHUB_OUTPUT
            echo "is_unstable=false" >> $GITHUB_OUTPUT
            echo "checkout_ref=${{ github.ref }}" >> $GITHUB_OUTPUT
            echo "Detected: Stable release (tag push)"
          elif [[ "${{ github.event.inputs.release_type }}" == "stable" ]]; then
            # Manual stable release
            VERSION_TAG="${{ github.event.inputs.version }}"
            if [[ -z "$VERSION_TAG" ]]; then
              echo "Error: version input required for manual stable release"
              exit 1
            fi
            echo "is_stable=true" >> $GITHUB_OUTPUT
            echo "is_unstable=false" >> $GITHUB_OUTPUT
            echo "checkout_ref=$VERSION_TAG" >> $GITHUB_OUTPUT
            echo "Detected: Manual stable release ($VERSION_TAG)"
          else
            # Manual unstable release
            echo "is_stable=false" >> $GITHUB_OUTPUT
            echo "is_unstable=true" >> $GITHUB_OUTPUT
            echo "checkout_ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            echo "Detected: Unstable release"
          fi
  generate-unstable-version:
    if: |
      always() &&
      needs.determine-release-type.outputs.is_unstable == 'true'
    name: Generate Unstable Version
    needs: determine-release-type
    outputs:
      short_sha: ${{ steps.version.outputs.short_sha }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.determine-release-type.outputs.checkout_ref }}
      - id: version
        name: Generate unstable version
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="0.0.0-unstable.${DATE}.${SHORT_SHA}"
          TAG_NAME="unstable-${DATE}-${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "npm version: $VERSION"
          echo "git tag: $TAG_NAME"
  publish-action:
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.determine-release-type.outputs.is_stable == 'true' &&
      !contains(needs.validate-stable.outputs.version, '-rc.')
    name: Publish setup-datamitsu action
    needs:
      - build
      - determine-release-type
      - validate-stable
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.determine-release-type.outputs.checkout_ref }}
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "false"
      - if: ${{ !env.ACT }}
        name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .
      - if: ${{ !env.ACT }}
        name: Check out setup-datamitsu (publish target)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: setup-datamitsu-dist
          ref: main
          repository: datamitsu/setup-datamitsu
          token: ${{ secrets.SETUP_DATAMITSU_TOKEN }}
      - env:
          GH_TOKEN: ${{ secrets.SETUP_DATAMITSU_TOKEN }}
          TARGET_DIR: ${{ github.workspace }}/setup-datamitsu-dist
        if: ${{ !env.ACT }}
        name: Bake hashes, build, and publish action
        run: |
          VERSION_WITH_V="${{ needs.validate-stable.outputs.version }}"
          export VERSION="${VERSION_WITH_V#v}"
          pnpm --filter @datamitsu/setup-action codegen
          pnpm --filter @datamitsu/setup-action build
          pnpm --filter @datamitsu/setup-action exec tsx scripts/publish.ts
  publish-docker:
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success'
    name: Publish Docker Images
    needs:
      - build
      - determine-release-type
      - validate-stable
      - generate-unstable-version
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.determine-release-type.outputs.checkout_ref }}
      - if: ${{ !env.ACT }}
        name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: linux/amd64,linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: version
        name: Normalize version (remove v prefix for labels)
        run: |
          VERSION_WITH_V="${{ needs.determine-release-type.outputs.is_stable == 'true' && needs.validate-stable.outputs.version || needs.generate-unstable-version.outputs.version }}"
          VERSION="${VERSION_WITH_V#v}"
          echo "normalized=$VERSION" >> $GITHUB_OUTPUT
      - if: ${{ !env.ACT && matrix.registry == 'ghcr' }}
        name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}
      - if: ${{ !env.ACT && matrix.registry == 'dockerhub' }}
        name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
      # Generate metadata for production builds
      - id: meta
        name: Generate Docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          flavor: |
            suffix=${{ matrix.variant == 'alpine' && '-alpine' || '' }}
          images: |
            ${{ matrix.registry == 'ghcr' && format('ghcr.io/datamitsu/{0}', needs.determine-release-type.outputs.is_stable == 'true' && 'datamitsu' || 'datamitsu-unstable') || 'docker.io/datamitsu/datamitsu' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.normalized }}
          tags: |
            type=semver,pattern={{version}},enable=${{ needs.determine-release-type.outputs.is_stable == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.determine-release-type.outputs.is_stable == 'true' }}
            type=semver,pattern={{major}},enable=${{ needs.determine-release-type.outputs.is_stable == 'true' }}
            type=raw,value=stable,enable=${{ needs.determine-release-type.outputs.is_stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.determine-release-type.outputs.is_stable == 'true' && !contains(needs.validate-stable.outputs.version, '-rc.') }}
            type=raw,value=unstable,enable=${{ needs.determine-release-type.outputs.is_unstable == 'true' && matrix.registry == 'dockerhub' }}
            type=raw,value=${{ needs.generate-unstable-version.outputs.tag_name }},enable=${{ needs.determine-release-type.outputs.is_unstable == 'true' }}
      - id: push
        if: |
          matrix.registry == 'ghcr' ||
          (matrix.registry == 'dockerhub' && needs.determine-release-type.outputs.is_stable == 'true')
        name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: ${{ matrix.variant == 'alpine' && './docker/Dockerfile.alpine' || './docker/Dockerfile' }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: ${{ !env.ACT }}
          tags: ${{ steps.meta.outputs.tags }}
      - if: ${{ !env.ACT && steps.push.outputs.digest != '' }}
        name: Sign Docker image with cosign
        run: |
          IMAGE_NAME="${{ matrix.registry == 'ghcr' && format('ghcr.io/datamitsu/{0}', needs.determine-release-type.outputs.is_stable == 'true' && 'datamitsu' || 'datamitsu-unstable') || 'docker.io/datamitsu/datamitsu' }}"
          cosign sign --yes "${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
    strategy:
      matrix:
        registry:
          - ghcr
          - dockerhub
        variant:
          - debian
          - alpine
  publish-github:
    if: |
      needs.determine-release-type.outputs.is_unstable == 'true' &&
      github.event.inputs.create_github_prerelease == 'true'
    name: Publish to GitHub Releases
    needs:
      - build
      - determine-release-type
      - generate-unstable-version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.determine-release-type.outputs.checkout_ref }}
      - if: ${{ !env.ACT }}
        name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ !env.ACT }}
        name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          name: Unstable Build ${{ needs.generate-unstable-version.outputs.short_sha }}
          prerelease: true
          tag_name: ${{ needs.generate-unstable-version.outputs.tag_name }}
  publish-npm:
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success'
    name: Publish to npm
    needs:
      - build
      - determine-release-type
      - validate-stable
      - generate-unstable-version
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.determine-release-type.outputs.checkout_ref }}
      - uses: ./.github/actions/setup-environment
        with:
          registry-url: "https://registry.npmjs.org"
      - if: ${{ !env.ACT }}
        name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .
      - if: ${{ !env.ACT }}
        name: Restore executable permissions for npm packages
        run: |
          # GitHub Actions artifacts don't preserve executable permissions
          # Restore them for all platform-specific binaries
          find packaging/npm/datamitsu-* -type f \( -name "datamitsu" -o -name "datamitsu.exe" \) -exec chmod +x {} \;
          echo "✓ Restored executable permissions for npm package binaries"
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        name: Publish to npm
        run: |
          IS_STABLE="${{ needs.determine-release-type.outputs.is_stable }}"
          VERSION_WITH_V="${{ needs.determine-release-type.outputs.is_stable == 'true' && needs.validate-stable.outputs.version || needs.generate-unstable-version.outputs.version }}"
          export VERSION="${VERSION_WITH_V#v}"
          DRY_RUN=""
          if [[ -n "$ACT" ]]; then
            DRY_RUN="--dry-run"
            echo "Running in act mode - using --dry-run for npm publish"
          fi

          cd packaging/npm

          if [[ "$IS_STABLE" == "true" ]]; then
            # Stable: use pack.ts publish (auto-detects tag)
            node ../pack.ts publish $DRY_RUN
          else
            # Unstable: hardcoded unstable tag
            for dir in datamitsu-*/ datamitsu/; do
              cd "$dir"
              echo "Publishing $dir..."
              npm publish --access public --tag unstable $DRY_RUN
              cd ..
            done
          fi
  publish-open-vsx:
    # Environment for parity with the other registry jobs (pypi, rubygems,
    # vscode-marketplace): registries deploy through named environments.
    # Auto-created on first deploy; OVSX_PAT stays a repo secret.
    environment: open-vsx
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.determine-release-type.outputs.is_stable == 'true' &&
      !contains(needs.validate-stable.outputs.version, '-rc.')
    name: Publish to Open VSX
    needs:
      - build
      - determine-release-type
      - validate-stable
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.determine-release-type.outputs.checkout_ref }}
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "false"
      - if: ${{ !env.ACT }}
        name: Download .vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: dist
      - env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: ${{ !env.ACT }}
        name: Publish extension to Open VSX
        run: |
          VERSION_WITH_V="${{ needs.validate-stable.outputs.version }}"
          VERSION="${VERSION_WITH_V#v}"
          # Namespace created once; tolerate "already exists".
          pnpm --filter "./editors/vscode" exec ovsx create-namespace datamitsu -p "$OVSX_PAT" || true
          pnpm --filter "./editors/vscode" exec ovsx publish "$GITHUB_WORKSPACE/dist/datamitsu-$VERSION.vsix" -p "$OVSX_PAT"
  publish-pypi:
    environment: pypi
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.determine-release-type.outputs.is_stable == 'true'
    name: Publish to PyPI
    needs:
      - build
      - determine-release-type
      - validate-stable
      - generate-unstable-version
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.determine-release-type.outputs.checkout_ref }}
      - uses: ./.github/actions/setup-environment
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - if: ${{ !env.ACT }}
        name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .
      - name: Prepare Python package
        run: |
          VERSION_WITH_V="${{ needs.determine-release-type.outputs.is_stable == 'true' && needs.validate-stable.outputs.version || needs.generate-unstable-version.outputs.version }}"
          export VERSION="${VERSION_WITH_V#v}"

          # Restore executable permissions on source binaries before prepare
          # (GitHub Actions artifacts don't preserve Unix permissions)
          if [ -d "dist/binaries" ]; then
            find dist/binaries -type f -name "datamitsu*" ! -name "*.exe" -exec chmod +x {} \;
            echo "✓ Restored executable permissions on dist/binaries"
          fi

          node packaging/pack.ts prepare-python
      - name: Build Python wheels
        run: node packaging/pack.ts build-python
      - if: ${{ !env.ACT }}
        name: Publish to PyPI
        run: |
          cd packaging/python
          # --trusted-publishing always: use OIDC, fail if unavailable (no API token fallback)
          # --check-url: skip already-published versions without masking real errors
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/
          echo "PyPI publishing completed"
  publish-rubygems:
    environment: rubygems
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.determine-release-type.outputs.is_stable == 'true'
    name: Publish to RubyGems
    needs:
      - build
      - determine-release-type
      - validate-stable
      - generate-unstable-version
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.determine-release-type.outputs.checkout_ref }}
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "false"
      - name: Setup Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
        with:
          ruby-version: "3.3"
      - if: ${{ !env.ACT }}
        name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: .
      - name: Prepare Ruby gem
        run: |
          VERSION_WITH_V="${{ needs.determine-release-type.outputs.is_stable == 'true' && needs.validate-stable.outputs.version || needs.generate-unstable-version.outputs.version }}"
          export VERSION="${VERSION_WITH_V#v}"

          # Restore executable permissions on source binaries
          # (GitHub Actions artifacts don't preserve Unix permissions)
          if [ -d "dist/binaries" ]; then
            find dist/binaries -type f -name "datamitsu*" ! -name "*.exe" -exec chmod +x {} \;
            echo "Restored executable permissions on dist/binaries"
          fi

          node packaging/pack.ts prepare-ruby
      - name: Build gem
        run: |
          cd packaging/ruby
          gem build datamitsu.gemspec
          echo "Built gem:"
          ls -lh *.gem
      - if: ${{ !env.ACT }}
        name: Configure RubyGems credentials (OIDC)
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - if: ${{ !env.ACT }}
        name: Publish to RubyGems
        run: |
          cd packaging/ruby
          gem push *.gem
          echo "RubyGems publishing completed"
  publish-vscode-marketplace:
    environment: vscode-marketplace
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.determine-release-type.outputs.is_stable == 'true' &&
      !contains(needs.validate-stable.outputs.version, '-rc.')
    name: Publish to VS Code Marketplace
    needs:
      - build
      - determine-release-type
      - validate-stable
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.determine-release-type.outputs.checkout_ref }}
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "false"
      - if: ${{ !env.ACT }}
        name: Download .vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsix
          path: dist
      - if: ${{ !env.ACT }}
        name: Azure login (federated OIDC for Marketplace)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          allow-no-subscriptions: true
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
      - if: ${{ !env.ACT }}
        name: Publish extension to VS Code Marketplace
        run: |
          VERSION_WITH_V="${{ needs.validate-stable.outputs.version }}"
          VERSION="${VERSION_WITH_V#v}"
          # Publish via Entra OIDC — the azure/login step above set up the Azure
          # CLI session that `vsce --azure-credential` consumes (no PAT).
          pnpm --filter "./editors/vscode" exec vsce publish --packagePath "$GITHUB_WORKSPACE/dist/datamitsu-$VERSION.vsix" --azure-credential
  validate-stable:
    if: |
      always() &&
      needs.determine-release-type.outputs.is_stable == 'true'
    name: Validate Stable Release
    needs: determine-release-type
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.determine-release-type.outputs.checkout_ref }}
      - name: Verify tag is on main branch
        run: |
          TAG_REF="${{ needs.determine-release-type.outputs.checkout_ref }}"
          TAG_COMMIT=$(git rev-parse $TAG_REF)
          if ! git branch -r --contains $TAG_COMMIT | grep -q 'origin/main'; then
            echo "Error: Tag $TAG_REF is not on main branch"
            exit 1
          fi
          echo "Tag is on main branch"
      - id: version
        name: Extract version from tag
        run: |
          TAG_REF="${{ needs.determine-release-type.outputs.checkout_ref }}"
          VERSION="${TAG_REF#refs/tags/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Stable version: $VERSION"
name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      create_github_prerelease:
        default: false
        description: "Create GitHub prerelease (for debugging binaries/checksums)"
        required: false
        type: boolean
      ref:
        default: "main"
        description: "Branch or commit to build (unstable only)"
        required: false
      release_type:
        default: unstable
        description: "Release type"
        options:
          - unstable
          - stable
        required: true
        type: choice
      version:
        description: "Version tag (stable manual, e.g., v1.0.0)"
        required: false
permissions:
  contents: read
  packages: read
