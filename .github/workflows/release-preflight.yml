      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Verify signature and publish exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_VERSION: ${{ needs.preflight.outputs.version }}
          APPROVED_TAG: ${{ needs.preflight.outputs.release_tag }}
          APPROVED_SHA: ${{ needs.preflight.outputs.source_sha }}
          SIGNER_SHA: ${{ needs.finalize-github-assets.outputs.signer_sha }}
          INDEX_ID: ${{ needs.preflight.outputs.index_id }}
          INDEX_DIGEST: ${{ needs.preflight.outputs.index_digest }}
        run: |
          dist="$RUNNER_TEMP/release-payloads/release/dist"
          bundle="$RUNNER_TEMP/checksum-signature/checksums.txt.sigstore.json"
          bash .github/scripts/recover-checksum-signature.sh verify "$dist/checksums.txt" "$bundle" "$INDEX_ID" "$INDEX_DIGEST" "$SIGNER_SHA"
          cp "$bundle" "$dist/checksums.txt.sigstore.json"
          python3 .github/scripts/publish-prerelease.py "$dist" "$APPROVED_VERSION" "$APPROVED_TAG" "$APPROVED_SHA"
  publisher-inputs:
    if: ${{ !cancelled() && needs.preflight.outputs.publication_enabled == 'true' && needs.preflight.result == 'success' && needs.publish-images.result == 'success' && (needs.publish-github.result == 'success' || (needs.preflight.outputs.github_release == 'false' && needs.publish-github.result == 'skipped')) && needs.verify-parser.result == 'success' }}
    needs:
      - preflight
      - verify-parser
      - publish-images
      - publish-github
    concurrency:
      group: npm-datamitsu-unstable-publication
      queue: max
      cancel-in-progress: false
    environment:
      name: release-publication
      url: ${{ needs.preflight.outputs.review_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify approved payload ZIPs before extraction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_PAYLOADS: ${{ needs.preflight.outputs.payloads }}
