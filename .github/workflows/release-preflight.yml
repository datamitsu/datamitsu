      - name: Upload missing npm versions without promoting unstable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ needs.preflight.outputs.mode }}
          APPROVED_TAG: ${{ needs.preflight.outputs.release_tag }}
          APPROVED_SHA: ${{ needs.preflight.outputs.source_sha }}
          APPROVED_VERSION: ${{ needs.preflight.outputs.version }}
          PREPARATION_RUN: ${{ needs.preflight.outputs.preparation_run }}
          PRODUCING_ATTEMPT: ${{ needs.preflight.outputs.producing_attempt }}
          INDEX_ID: ${{ needs.preflight.outputs.index_id }}
          INDEX_DIGEST: ${{ needs.preflight.outputs.index_digest }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm_dist="$RUNNER_TEMP/release-payloads/release/dist/npm"
          args=("$npm_dist" "$APPROVED_VERSION" --upload-missing)
          if [[ "$RELEASE_MODE" == tag ]]; then
            observed=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$APPROVED_TAG" --jq .sha)
            [[ "$observed" == "$APPROVED_SHA" ]]
            bundle_dir="$(realpath -- "$RUNNER_TEMP")/npm-proof"
            python3 .github/scripts/fetch-npm-provenance.py "$npm_dist" "$bundle_dir" "$PREPARATION_RUN" "$PRODUCING_ATTEMPT" "$INDEX_ID"
            args+=(--source-repository "$GITHUB_REPOSITORY" --source-sha "$APPROVED_SHA" --source-ref "refs/tags/$APPROVED_TAG"
                   --source-run "$PREPARATION_RUN" --producing-attempt "$PRODUCING_ATTEMPT" --index-id "$INDEX_ID"
                   --index-archive-digest "$INDEX_DIGEST" --provenance-dir "$bundle_dir")
          fi
          python3 .github/scripts/check-npm-release.py "${args[@]}"
      - name: Promote reconciled npm channel
        env:
          APPROVED_VERSION: ${{ needs.preflight.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LEGACY_BASELINE: ${{ needs.preflight.outputs.mode == 'prerelease' && vars.NPM_UNSTABLE_CUTOVER_BASELINE || contains(needs.preflight.outputs.version, '-rc.') && vars.NPM_NEXT_CUTOVER_BASELINE || needs.preflight.outputs.mode == 'tag' && !contains(needs.preflight.outputs.version, '-rc.') && vars.NPM_LATEST_CUTOVER_BASELINE || '' }}
        shell: bash
        run: |
          args=("$RUNNER_TEMP/release-payloads/release/dist/npm" "$APPROVED_VERSION")
          if [[ -n "$LEGACY_BASELINE" ]]; then
            baseline=$(mktemp)
            trap 'rm -f "$baseline"' EXIT
            printf '%s\n' "$LEGACY_BASELINE" > "$baseline"
            args+=("$baseline")
          fi
          python3 .github/scripts/promote-npm-unstable.py "${args[@]}"
  publish-tagged-pypi:
    if: ${{ needs.preflight.outputs.publication_enabled == 'true' && needs.preflight.outputs.mode == 'tag' && needs.preflight.outputs.publish_pypi == 'true' }}
    needs: preflight
    environment:
      name: pypi
      url: ${{ needs.preflight.outputs.review_url }}
    concurrency:
      group: pypi-datamitsu-${{ needs.preflight.outputs.version }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Stage approved wheels
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_PAYLOADS: ${{ needs.preflight.outputs.payloads }}
          APPROVED_VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 .github/scripts/stage-release-payloads.py "$RUNNER_TEMP/release-payloads"
      - &recheck_release_tag
        name: Recheck approved tag after environment approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_TAG: ${{ needs.preflight.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          number='(0|[1-9][0-9]*)'
          [[ "$APPROVED_TAG" =~ ^v${number}\.${number}\.${number}(-rc\.${number})?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          observed=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$APPROVED_TAG" --jq .sha)
          [[ "$observed" == "$SOURCE_SHA" ]] || { echo 'Approved release tag no longer points to the prepared commit' >&2; exit 1; }
      - name: Upload checked wheels to PyPI
        shell: bash
        env:
          APPROVED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/release-payloads/release/dist/python"
          missing=$(python3 "$GITHUB_WORKSPACE/.github/scripts/check-pypi-release.py" . "$APPROVED_VERSION")
          if [[ -n "$missing" ]]; then
            mapfile -t wheels <<< "$missing"
            uv --no-config publish --trusted-publishing always \
              --publish-url https://upload.pypi.org/legacy/ --check-url https://pypi.org/simple/ -- "${wheels[@]}"
          fi
          python3 "$GITHUB_WORKSPACE/.github/scripts/check-pypi-release.py" . "$APPROVED_VERSION" --require-complete
  publish-tagged-rubygems:
    if: ${{ needs.preflight.outputs.publication_enabled == 'true' && needs.preflight.outputs.mode == 'tag' && needs.preflight.outputs.publish_rubygems == 'true' }}
    needs: preflight
    environment:
      name: rubygems
      url: ${{ needs.preflight.outputs.review_url }}
    concurrency:
      group: rubygems-datamitsu-${{ needs.preflight.outputs.version }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.3"
      - name: Stage approved gem
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_PAYLOADS: ${{ needs.preflight.outputs.payloads }}
          APPROVED_VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 .github/scripts/stage-release-payloads.py "$RUNNER_TEMP/release-payloads"
      - name: Reconcile the exact gem version
        id: gem
        shell: bash
        env:
          APPROVED_VERSION: ${{ needs.preflight.outputs.version }}
        run: &reconcile_tagged_gem |
          gem_file="$RUNNER_TEMP/release-payloads/release/dist/ruby/datamitsu.gem"
          version=${APPROVED_VERSION/-rc./.rc.}
          ruby .github/scripts/check-release-gem.rb "$gem_file" "$APPROVED_VERSION"
          digest=$(sha256sum "$gem_file" | cut -d' ' -f1)
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          for attempt in 1 2 3 4 5; do
            status=$(curl -q -sS --max-time 30 --output "$response" --write-out '%{http_code}' \
              "https://rubygems.org/api/v2/rubygems/datamitsu/versions/$version.json?platform=ruby")
            if [[ "$status" != 404 || "${REQUIRE_PUBLISHED:-false}" != true || "$attempt" == 5 ]]; then
              break
            fi
            sleep 3
          done
          case "$status" in
            200)
              jq -e --arg version "$version" --arg digest "$digest" '
                .name == "datamitsu" and .version == $version and .platform == "ruby" and .sha == $digest and .yanked == false
              ' "$response" > /dev/null || { echo 'Existing RubyGems version does not match the approved gem' >&2; exit 1; }
              echo 'missing=false' >> "$GITHUB_OUTPUT"
              ;;
            404)
              if [[ "${REQUIRE_PUBLISHED:-false}" == true ]]; then
                echo 'RubyGems has not confirmed the uploaded gem' >&2
                exit 1
              fi
              echo 'missing=true' >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unexpected RubyGems lookup status: $status" >&2; exit 1 ;;
          esac
      - *recheck_release_tag
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
        if: steps.gem.outputs.missing == 'true'
      - name: Upload only the missing gem
        if: steps.gem.outputs.missing == 'true'
        run: gem push --host https://rubygems.org "$RUNNER_TEMP/release-payloads/release/dist/ruby/datamitsu.gem"
      - name: Verify the uploaded gem
        if: steps.gem.outputs.missing == 'true'
        shell: bash
        env:
          APPROVED_VERSION: ${{ needs.preflight.outputs.version }}
          REQUIRE_PUBLISHED: "true"
        run: *reconcile_tagged_gem
  publish-setup-action:
    if: ${{ needs.preflight.outputs.publication_enabled == 'true' && needs.preflight.outputs.mode == 'tag' && !contains(needs.preflight.outputs.version, '-rc.') }}
    needs:
      - preflight
      - publish-github
    environment: setup-action
    concurrency:
      group: datamitsu-setup-action
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - &stage_approved_distribution
        name: Stage approved release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_PAYLOADS: ${{ needs.preflight.outputs.payloads }}
          APPROVED_VERSION: ${{ needs.preflight.outputs.version }}
        run: python3 .github/scripts/stage-release-payloads.py "$RUNNER_TEMP/release-payloads"
      - *recheck_release_tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: datamitsu/setup-datamitsu
          ref: main
          path: setup-action-destination
          token: ${{ secrets.SETUP_DATAMITSU_TOKEN }}
      - name: Publish checked action files
        env:
          GH_TOKEN: ${{ secrets.SETUP_DATAMITSU_TOKEN }}
          TARGET_DIR: ${{ github.workspace }}/setup-action-destination
          VERSION: ${{ needs.preflight.outputs.version }}
        run: APPROVED_DIST_DIR="$RUNNER_TEMP/release-payloads/release/dist/setup-action" node packaging/action/scripts/publish.ts
  publish-editor-extension:
    if: ${{ needs.preflight.outputs.publication_enabled == 'true' && needs.preflight.outputs.mode == 'tag' && !contains(needs.preflight.outputs.version, '-rc.') }}
    needs:
      - preflight
      - publish-github
    environment: ${{ matrix.store == 'open-vsx' && 'open-vsx' || 'vscode-marketplace' }}
    concurrency:
      group: datamitsu-editor-${{ matrix.store }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        store:
          - open-vsx
          - marketplace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - *stage_approved_distribution
      - uses: ./.github/actions/setup-environment
        with:
          setup-go: "false"
          install-dependencies: "false"
          cache-datamitsu: "false"
          cache-toolchains: "false"
      - name: Install pinned publisher tools without lifecycle hooks
        run: pnpm --filter './editors/vscode' install --frozen-lockfile --ignore-scripts
      - *recheck_release_tag
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: matrix.store == 'marketplace'
        with:
          allow-no-subscriptions: true
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
      - name: Publish the exact checked VSIX
        shell: bash
        env:
          STORE: ${{ matrix.store }}
          VERSION: ${{ needs.preflight.outputs.version }}
          OVSX_PAT: ${{ matrix.store == 'open-vsx' && secrets.OVSX_PAT || '' }}
        run: |
          pnpm --filter './editors/vscode' exec python3 "$GITHUB_WORKSPACE/.github/scripts/publish-prepared-vsix.py" \
            "$STORE" "$RUNNER_TEMP/release-payloads/vsix/datamitsu-$VERSION.vsix" "$VERSION"
  publish-install-manifests:
    if: ${{ needs.preflight.outputs.publication_enabled == 'true' && needs.preflight.outputs.mode == 'tag' && !contains(needs.preflight.outputs.version, '-rc.') }}
    needs:
      - preflight
      - publish-github
    environment: ${{ matrix.target }}
    concurrency:
      group: datamitsu-install-manifests-${{ matrix.target }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - homebrew
          - scoop
          - winget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - *stage_approved_distribution
      - *recheck_release_tag
      - name: Publish manifest for checked GitHub Release assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          APPROVED_VERSION: ${{ needs.preflight.outputs.version }}
          APPROVED_SHA: ${{ needs.preflight.outputs.source_sha }}
          GH_TOKEN: ${{ matrix.target == 'homebrew' && secrets.HOMEBREW_TAP_TOKEN || matrix.target == 'scoop' && secrets.SCOOP_TOKEN || matrix.target == 'winget' && secrets.WINGET_TOKEN || '' }}
        run: |
          [[ -n "$GH_TOKEN" ]]
          python3 .github/scripts/publish-release-manifests.py "$TARGET" \
            "$RUNNER_TEMP/release-payloads/release/dist" "$APPROVED_VERSION" "$APPROVED_SHA"
  promote-stable:
    if: ${{ needs.preflight.outputs.publication_enabled == 'true' && needs.preflight.outputs.mode == 'tag' && !contains(needs.preflight.outputs.version, '-rc.') }}
    needs:
      - preflight
      - publish-github
      - finalize-github-assets
      - verify-parser
      - publish-images
      - publisher-inputs
      - publish-tagged-pypi
      - publish-tagged-rubygems
      - publish-setup-action
      - publish-editor-extension
      - publish-install-manifests
    environment: release-publication
    concurrency:
      group: datamitsu-stable-alias-${{ matrix.channel }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel:
          - github
          - parser
          - ghcr
          - dockerhub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - *stage_approved_distribution
      - *recheck_release_tag
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.channel == 'github'
        with:
          artifact-ids: ${{ needs.finalize-github-assets.outputs.bundle_id || 'missing-artifact-id' }}
          path: ${{ runner.temp }}/checksum-signature
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: matrix.channel == 'github'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: matrix.channel == 'ghcr'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: matrix.channel == 'dockerhub'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote already-published stable bytes
        shell: bash
        env:
          CHANNEL: ${{ matrix.channel }}
          APPROVED_VERSION: ${{ needs.preflight.outputs.version }}
          VERSION: ${{ needs.preflight.outputs.release_tag }}
          PREPARATION_SHA: ${{ needs.preflight.outputs.source_sha }}
          PREPARATION_RUN_ID: ${{ needs.preflight.outputs.preparation_run }}
          PREPARATION_ATTEMPT: ${{ needs.preflight.outputs.preparation_attempt }}
          INDEX_ID: ${{ needs.preflight.outputs.index_id }}
          INDEX_DIGEST: ${{ needs.preflight.outputs.index_digest }}
          SIGNER_SHA: ${{ needs.finalize-github-assets.outputs.signer_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          dist="$RUNNER_TEMP/release-payloads/release/dist"
          case "$CHANNEL" in
            github)
              bundle="$RUNNER_TEMP/checksum-signature/checksums.txt.sigstore.json"
              bash .github/scripts/recover-checksum-signature.sh verify "$dist/checksums.txt" "$bundle" "$INDEX_ID" "$INDEX_DIGEST" "$SIGNER_SHA"
              cp "$bundle" "$dist/checksums.txt.sigstore.json"
              python3 .github/scripts/publish-prerelease.py --promote-latest "$dist" "$APPROVED_VERSION" "$VERSION" "$PREPARATION_SHA"
              ;;
            parser)
              (cd "${dist%/dist}" && IS_STABLE=true node "$GITHUB_WORKSPACE/.github/scripts/push-parsers-oci.mjs" promote-stable)
              ;;
            ghcr|dockerhub)
              python3 .github/scripts/publish-prepared-images.py "$dist" "$VERSION" --registry "$CHANNEL" --promote
              ;;
            *) exit 1 ;;
          esac
