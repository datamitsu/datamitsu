jobs:
  build-verify:
    if: github.event_name == 'pull_request'
    name: Build Verification
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-environment
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      # Build the WASM parser module BEFORE goreleaser: .goreleaser.yml lists it
      # under extra_files, so a snapshot build globbing-fails without it. Mirrors
      # release.yml. rustup/cargo are preinstalled on ubuntu-latest; only the
      # freestanding wasm32 target needs adding.
      - name: Add Rust wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache cargo registry + wasm target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: wasm-parsers-${{ runner.os }}-${{ hashFiles('parsers/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            parsers/target
          restore-keys: |
            wasm-parsers-${{ runner.os }}-
      - # Bake the PR version into the module's `describe` output (option_env! in
        # parsers/src/capabilities.rs), mirroring release.yml.
        env:
          DATAMITSU_PARSERS_VERSION: 0.0.0-pr.${{ github.event.pull_request.number }}
        name: Build WASM parser modules
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path parsers/Cargo.toml
          echo "wasm size: $(wc -c < parsers/target/wasm32-unknown-unknown/release/datamitsu_parsers.wasm) bytes"
      - env:
          GORELEASER_CURRENT_TAG: 0.0.0-pr.${{ github.event.pull_request.number }}
        name: Build binaries with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --snapshot --clean --skip=sign
          distribution: goreleaser
          version: "~> v2"
      - name: Normalize binaries
        run: .github/scripts/normalize-binaries.sh "true"
      - name: Prepare npm packages
        run: |
          export VERSION=0.0.0-pr.${{ github.event.pull_request.number }}
          pnpm pack:prepare
  docker-build:
    if: github.event_name == 'pull_request'
    name: Docker Build Test
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-environment
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      # Build the WASM parser module BEFORE goreleaser: .goreleaser.yml lists it
      # under extra_files, so a snapshot build globbing-fails without it. Mirrors
      # release.yml. rustup/cargo are preinstalled on ubuntu-latest; only the
      # freestanding wasm32 target needs adding.
      - name: Add Rust wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache cargo registry + wasm target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: wasm-parsers-${{ runner.os }}-${{ hashFiles('parsers/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            parsers/target
          restore-keys: |
            wasm-parsers-${{ runner.os }}-
      - # Bake the PR version into the module's `describe` output (option_env! in
        # parsers/src/capabilities.rs), mirroring release.yml.
        env:
          DATAMITSU_PARSERS_VERSION: 0.0.0-pr.${{ github.event.pull_request.number }}
        name: Build WASM parser modules
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path parsers/Cargo.toml
          echo "wasm size: $(wc -c < parsers/target/wasm32-unknown-unknown/release/datamitsu_parsers.wasm) bytes"
      - env:
          GORELEASER_CURRENT_TAG: 0.0.0-pr.${{ github.event.pull_request.number }}
        name: Build binaries with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --snapshot --clean --skip=sign
          distribution: goreleaser
          version: "~> v2"
      - name: Prepare binaries for Docker
        run: |
          # GoReleaser in snapshot mode creates binaries in dist/datamitsu_{OS}_{ARCH}_{MICROARCH}/
          # Docker expects: dist/datamitsu-linux-{arch}/datamitsu

          mkdir -p dist/datamitsu-linux-amd64
          mkdir -p dist/datamitsu-linux-arm64

          # Find binaries in target directories (strip microarchitecture suffix)
          for dir in dist/datamitsu_linux_*_*/; do
            binary=$(find "$dir" -maxdepth 1 -type f -name "datamitsu" | head -1)
            if [ -f "$binary" ]; then
              dirname=$(basename "$dir")
              # Extract arch: datamitsu_linux_amd64_v1 -> amd64
              arch=$(echo "$dirname" | sed 's/^datamitsu_linux_//' | sed 's/_v[0-9.]*$//')
              cp "$binary" "dist/datamitsu-linux-${arch}/datamitsu"
              echo "✓ Copied: $binary -> dist/datamitsu-linux-${arch}/datamitsu"
            fi
          done

          chmod +x dist/datamitsu-linux-*/datamitsu
          ls -lh dist/datamitsu-linux-*/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build Debian image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: datamitsu:pr-${{ github.event.pull_request.number }}
      - name: Build Alpine image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: ./docker/Dockerfile.alpine
          platforms: linux/amd64,linux/arm64
          push: false
          tags: datamitsu:pr-${{ github.event.pull_request.number }}-alpine
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-environment
      - name: Check Go modules are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Run datamitsu lint
        run: pnpm dm lint
  pr-title:
    if: github.event_name == 'pull_request'
    name: PR Title
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          requireScope: false
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-environment
      - name: Build embedded config library
        # Regenerate internal/config/config.js so the instrumented binary the
        # blackbox CLI tier builds (go build -cover . at module root) embeds the
        # current config. config.js is checked in, but the contract goldens
        # depend on it being fresh.
        run: pnpm dm exec task -- build:lib
      - name: Run Go tests (unit + blackbox CLI tier, merged coverage)
        # coverage-all.sh runs ./... — including the test/cli subprocess blackbox
        # tier — and merges in-process unit covdata with the blackbox GOCOVERDIR
        # counters into coverage.out. The gated OCI e2e tier (//go:build e2e_oci)
        # is excluded: no -tags e2e_oci is passed, so test/e2e has no test files.
        run: pnpm test:coverage:all
      - name: Fuzz .datamitsuignore (smoke)
        run: pnpm dm exec task -- test:fuzz
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          file: coverage.out
          format: golang
      - name: Build datamitsu binary
        run: go build -o datamitsu .
      - name: Run JavaScript tests
        run: pnpm --filter @datamitsu/programmable-api-js test
name: CI
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
permissions:
  contents: read
