jobs:
  prune:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Preview unstable prerelease cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep || '5' }}
        name: List cleanup candidates without deleting them
        run: bash .github/scripts/prune-unstable-prereleases.sh
name: Preview unstable prerelease cleanup
on:
  workflow_dispatch:
    inputs:
      keep:
        default: "5"
        description: "How many of the newest unstable prereleases to keep"
        required: false
        type: string
permissions:
  contents: read
