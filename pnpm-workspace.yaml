# cspell:ignore keytar
allowBuilds:
  "@swc/core": false
  "@vscode/vsce-sign": false
  core-js: false
  esbuild: false
  keytar: false
  sharp: true
audit: true
auditLevel: high
autoInstallPeers: true
catalog:
  "@shibanet0/datamitsu-config": 0.1.7
enableGlobalVirtualStore: true
enablePrePostScripts: false
hoistPattern: []
ignorePatchFailures: false
minimumReleaseAgeExclude:
  - "@datamitsu/*"
  - "@ovineko/*"
  - "@shibanet0/*"
optimisticRepeatInstall: true
# Pin the vscode-* deps injected into langium (below) so mermaid's bundle in the
# website stays on the 8.2.x/3.17.x line. Without this the "*" floats to 9.0.0 /
# 3.18.1 once anything pulls them into the tree, and Docusaurus's webpack then
# fails to bundle vscode-jsonrpc ("Emitter is not exported").
overrides:
  # Keep every official @docusaurus/* package aligned with @docusaurus/core.
  # docusaurus-plugin-ideal-image is pinned transitively by
  # @ovineko/docusaurus-config, so a website bump alone leaves it behind and
  # Docusaurus refuses to build on a version mismatch.
  "@docusaurus/plugin-ideal-image": 3.10.2
  vscode-jsonrpc: 8.2.0
  vscode-languageserver-protocol: 3.17.5
  vscode-languageserver-types: 3.17.5
packageExtensions:
  langium:
    dependencies:
      "@chevrotain/regexp-to-ast": "*"
      vscode-jsonrpc: "*"
      vscode-languageserver-protocol: "*"
      vscode-languageserver-types: "*"
packages:
  - packaging/action
  - editors/*
  - programmable-api/js
  - website
  - parsers/datamitsu-parsers
resolutionMode: lowest-direct
savePrefix: ""
strictSsl: true
unsafePerm: false
verifyDepsBeforeRun: install
