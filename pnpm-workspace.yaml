# cspell:ignore keytar
allowBuilds:
  "@swc/core": false
  "@vscode/vsce-sign": false
  core-js: false
  esbuild: false
  keytar: false
  sharp: true
audit: {}
auditLevel: high
autoInstallPeers: true
catalog:
  "@shibanet0/datamitsu-config": 0.1.7
enableGlobalVirtualStore: true
enablePrePostScripts: false
hoistPattern: []
ignorePatchFailures: false
minimumReleaseAgeExclude:
  - "@datamitsu/*"
  - "@ovineko/*"
  - "@shibanet0/*"
optimisticRepeatInstall: true
# Pin the vscode-* deps (injected into langium below, and required by the vscode
# extension's vscode-languageclient) so the whole tree stays on one line. These
# are the versions vscode-languageclient 10 depends on; Docusaurus's mermaid
# bundle also builds cleanly against them. Pinning keeps langium's "*" specs from
# floating to an untested combination.
overrides:
  # Keep every official @docusaurus/* package aligned with @docusaurus/core.
  # docusaurus-plugin-ideal-image is pinned transitively by
  # @ovineko/docusaurus-config, so a website bump alone leaves it behind and
  # Docusaurus refuses to build on a version mismatch.
  "@docusaurus/plugin-ideal-image": 3.10.2
  vscode-jsonrpc: 9.0.1
  vscode-languageserver-protocol: 3.18.2
  vscode-languageserver-types: 3.18.0
packageExtensions:
  langium:
    dependencies:
      "@chevrotain/regexp-to-ast": "*"
      vscode-jsonrpc: "*"
      vscode-languageserver-protocol: "*"
      vscode-languageserver-types: "*"
packages:
  - packaging/action
  - editors/*
  - programmable-api/js
  - website
  - parsers/datamitsu-parsers
resolutionMode: lowest-direct
savePrefix: ""
strictSsl: true
unsafePerm: false
verifyDepsBeforeRun: install
