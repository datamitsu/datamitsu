# cspell:ignore keytar
allowBuilds:
  "@swc/core": false
  "@vscode/vsce-sign": false
  core-js: false
  esbuild: false
  keytar: false
  sharp: true
audit: true
auditLevel: high
autoInstallPeers: true
catalog:
  "@shibanet0/datamitsu-config": 0.1.7
enableGlobalVirtualStore: true
enablePrePostScripts: false
hoistPattern: []
ignorePatchFailures: false
minimumReleaseAgeExclude:
  - "@datamitsu/*"
  - "@ovineko/*"
  - "@shibanet0/*"
optimisticRepeatInstall: true
packageExtensions:
  langium:
    dependencies:
      "@chevrotain/regexp-to-ast": "*"
      vscode-jsonrpc: "*"
      vscode-languageserver-protocol: "*"
      vscode-languageserver-types: "*"
packages:
  - packaging/action
  - editors/*
  - programmable-api/js
  - website
  - parsers/datamitsu-parsers
resolutionMode: lowest-direct
savePrefix: ""
strictSsl: true
unsafePerm: false
verifyDepsBeforeRun: install
