archives:
  - files:
      - LICENSE*
      - README*
      - completions/*
    format_overrides:
      - formats:
          - zip
        goos: windows
    formats:
      - tar.gz
    id: datamitsu-archive
    ids:
      - datamitsu
    name_template: "datamitsu_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - formats:
      - binary
    id: datamitsu-binary
    ids:
      - datamitsu
    name_template: "datamitsu_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
before:
  hooks:
    - go mod download
    - mkdir -p completions
    - go build -o completions/gen .
    - sh -c "completions/gen completion bash > completions/datamitsu.bash"
    - sh -c "completions/gen completion zsh > completions/_datamitsu"
    - sh -c "completions/gen completion fish > completions/datamitsu.fish"
    - rm completions/gen
builds:
  - binary: datamitsu
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goarch:
      - amd64
      - arm64
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    id: datamitsu
    ldflags:
      - -s -w
      - -X github.com/datamitsu/datamitsu/internal/ldflags.Version={{ .Version }}
      # Canonical base image ref for `devtools dockerfile`. Set via DATAMITSU_IMAGE_*
      # in CI (stable vs unstable repo/tag differ); falls back to the stable repo
      # and the version tag for local goreleaser runs.
      - -X github.com/datamitsu/datamitsu/internal/ldflags.ImageRepo={{ if index .Env "DATAMITSU_IMAGE_REPO" }}{{ .Env.DATAMITSU_IMAGE_REPO }}{{ else }}datamitsu/datamitsu{{ end }}
      - -X github.com/datamitsu/datamitsu/internal/ldflags.ImageTag={{ if index .Env "DATAMITSU_IMAGE_TAG" }}{{ .Env.DATAMITSU_IMAGE_TAG }}{{ else }}{{ .Version }}{{ end }}
    main: .
changelog:
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - order: 0
      regexp: "^.*?feat(\\([[:word:]]+\\))??!?:.+$"
      title: Features
    - order: 1
      regexp: "^.*?fix(\\([[:word:]]+\\))??!?:.+$"
      title: Bug Fixes
    - order: 2
      regexp: "^.*?perf(\\([[:word:]]+\\))??!?:.+$"
      title: Performance Improvements
    - order: 999
      title: Others
  sort: asc
  use: github
checksum:
  algorithm: sha256
  name_template: "checksums.txt"
homebrew_casks:
  - binaries:
      - datamitsu
    commit_author:
      email: noreply@github.com
      name: goreleaserbot
    commit_msg_template: "chore: update {{ .ProjectName }} cask to {{ .Tag }}"
    completions:
      bash: completions/datamitsu.bash
      fish: completions/datamitsu.fish
      zsh: completions/_datamitsu
    description: "Configuration management and binary distribution tool."
    directory: Casks
    homepage: "https://datamitsu.com/"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/datamitsu"]
          end
    ids:
      - datamitsu-archive
    name: datamitsu
    repository:
      branch: main
      name: homebrew-tap
      owner: datamitsu
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: auto
nfpms:
  - bindir: /usr/local/bin
    description: |-
      Configuration management and binary distribution tool.
      JavaScript-configurable tool orchestration for linting and development workflows.
    file_name_template: "datamitsu_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
      - apk
    homepage: https://github.com/datamitsu/datamitsu
    id: datamitsu
    ids:
      - datamitsu
    license: MIT
    maintainer: "datamitsu <noreply@github.com>"
    package_name: datamitsu
    priority: optional
    section: utils
    vendor: datamitsu
release:
  draft: false
  github:
    name: datamitsu
    owner: datamitsu
  prerelease: auto
sboms:
  - artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom"
scoops:
  - commit_author:
      email: noreply@github.com
      name: goreleaserbot
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    description: |-
      Configuration management and binary distribution tool.
      JavaScript-configurable tool orchestration for linting and development workflows.
    homepage: https://datamitsu.com/
    ids:
      - datamitsu-archive
    license: MIT
    name: datamitsu
    repository:
      branch: main
      name: scoop-bucket
      owner: datamitsu
      token: "{{ .Env.SCOOP_TOKEN }}"
    skip_upload: auto
signs:
  - args:
      - "sign-blob"
      - "--yes"
      - "${artifact}"
      - "--bundle=${signature}"
    artifacts: checksum
    cmd: cosign
    signature: "${artifact}.sigstore.json"
version: 2
winget:
  - commit_author:
      email: noreply@github.com
      name: goreleaserbot
    commit_msg_template: "{{ .PackageIdentifier }}: {{ .Tag }}"
    copyright: "datamitsu contributors"
    copyright_url: https://github.com/datamitsu/datamitsu/blob/main/LICENSE
    description: |-
      Configuration management and binary distribution tool.
      JavaScript-configurable tool orchestration for linting and development workflows.
    homepage: https://datamitsu.com/
    ids:
      - datamitsu-archive
    license: mit
    license_url: https://github.com/datamitsu/datamitsu/blob/main/LICENSE
    name: datamitsu
    package_identifier: datamitsu.datamitsu
    publisher: datamitsu
    publisher_support_url: https://github.com/datamitsu/datamitsu/issues/new
    publisher_url: https://datamitsu.com/
    release_notes: "{{.Changelog}}"
    release_notes_url: "https://github.com/datamitsu/datamitsu/releases/tag/{{ .Tag }}"
    repository:
      branch: "datamitsu-{{ .Tag }}"
      name: winget-pkgs
      owner: datamitsu
      pull_request:
        base:
          branch: master
          name: winget-pkgs
          owner: microsoft
        enabled: true
      token: "{{ .Env.WINGET_TOKEN }}"
    short_description: "Configuration management and binary distribution tool."
    skip_upload: auto
    tags:
      - golang
      - cli
      - devtools
