id = "datamitsu-lsp"
name = "Datamitsu Toolkit"
description = "Format files with your datamitsu config, via the datamitsu language server."
version = "0.0.0"
schema_version = 1
authors = ["datamitsu"]
repository = "https://github.com/datamitsu/datamitsu"

# Zed has no wildcard: a server attaches only to the languages named here, matched
# exactly against each language's `name`. A name no installed extension defines
# registers nothing, so the list also covers languages from popular extensions.
[language_servers.datamitsu]
name = "datamitsu"
languages = [
  "Alex",
